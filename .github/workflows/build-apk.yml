name: ساخت خودکار APK 🤖

# هر بار که کد پوش می‌شود، APK به‌صورت خودکار ساخته می‌شود
on:
  push:
    branches: [main, master]
    tags: ["v*"]          # تگ نسخه مثل v1.0.0 → انتشار در Releases
  pull_request:
    branches: [main]
  workflow_dispatch:       # اجرای دستی از تب Actions گیت‌هاب
    inputs:
      build_type:
        description: "نوع بیلد"
        required: true
        default: "release"
        type: choice
        options: [release, debug]

permissions:
  contents: write          # برای ساخت Release

jobs:
  build-apk:
    name: بیلد اندروید
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: ☕ نصب جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🐦 نصب Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable
          cache: true

      - name: 🛠 نصب Gradle 8.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.3"

      - name: 📦 دریافت پکیج‌ها
        run: flutter pub get

      - name: 🔧 اطمینان از وجود Gradle Wrapper
        run: |
          cd android
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.3 --distribution-type bin
          fi

      - name: 🔍 تحلیل کد (غیرمسدودکننده)
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: 🚀 بیلد APK Release (تقسیم‌شده بر معماری - حجم کمتر)
        run: flutter build apk --release --split-per-abi

      - name: 🚀 بیلد APK Release کامل (همه معماری‌ها)
        run: flutter build apk --release

      - name: 🧪 بیلد APK Debug
        run: flutter build apk --debug

      - name: 📤 آپلود Artifacts (دانلود از تب Actions)
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷 انتشار در بخش Releases (فقط با پوش تگ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true
