name: kelas_aval
description: >-
  آموزش کلاس اول — اپلیکیشن کاملاً فارسی و آفلاین آموزش حروف الفبا و اعداد ۰ تا ۱۰۰
  برای دانش‌آموزان کلاس اول دبستان ایران. مطابق استانداردهای آموزشی مدارس ایران.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # مدیریت وضعیت (State Management)
  provider: ^6.1.2

  # ذخیره‌سازی محلی کاملاً آفلاین
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # پخش صدا از داخل خود اپ (آفلاین)
  just_audio: ^0.9.40

  # گویندهٔ متنی سیستم (پشتیبان صوت‌های ضبط‌شده)
  flutter_tts: ^4.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/letters/
    - assets/images/mascot/
    - assets/sounds/
